[workspace]
resolver = "3"
members = [
    "crates/vqtt-core",
    "crates/vqtt-backends",
    "crates/vqtt-run",
    "crates/vqtt-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vqtt-core = { path = "crates/vqtt-core" }
vqtt-backends = { path = "crates/vqtt-backends" }
vqtt-run = { path = "crates/vqtt-run" }

anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
resvg = { version = "0.48", default-features = false, features = ["text"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
